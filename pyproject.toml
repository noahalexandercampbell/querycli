[project]
name = "querycli"
version = "0.1.0"
description = "A unified CLI query harness for JSON, YAML, TOML, CSV, and key=value text"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Hermes Agent", email = "hermes@example.com"}]

[project.scripts]
querycli = "querycli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["querycli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
